name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build packages
        run: python release.py packages
      - name: Upload artifacts (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/protobot-*
      - name: Publish artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/protobot-*

  portable:
    # The self-contained build is platform-specific (a frozen Python runtime),
    # so one job per platform; the zip name carries the platform tag.
    strategy:
      matrix:
        include:
          - os: windows-latest
          # ubuntu-22.04 builds against glibc 2.35, so the binary also runs on
          # Debian 12 / Rocky 9 class systems; 24.04 (glibc 2.39) would not.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the self-contained portable
        run: |
          uv sync --extra online --extra tui --extra qq
          uv run python release.py portable
      - name: Upload artifacts (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: dist/protobot-*
      - name: Publish artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/protobot-*
