name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: python release.py
      - name: Publish artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
