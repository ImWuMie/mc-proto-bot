[project]
name = "protobot"
version = "0.1.0"
description = "Dependency-free Python Minecraft protocol client and bot library with online-mode support"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
online = [
    "cryptography>=42.0.0",
]
tui = [
    "textual>=1.0",
]

# Development-only tooling. Runtime stays dependency-free; the suite also runs
# under ``python -m unittest`` with nothing installed at all.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
protobot = "protobot.cli_app:main"
protobot-export-block-states = "protobot.cli:export_block_states"
protobot-live-regression = "protobot.cli:live_regression"
protobot-movement-matrix = "protobot.cli:movement_matrix"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ``protobot`` is a real subdirectory of the checkout, so ordinary package
# discovery works. The explicit include keeps the top-level helper script
# (``run_bot.py``), the plugin examples, and the test suite out of the
# distribution.
[tool.setuptools.packages.find]
include = ["protobot*"]
namespaces = false

[tool.setuptools.package-data]
"protobot.data" = ["*.json.gz"]
